apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-03
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-03
  template:
    metadata:
      labels:
        app: catalog-03
    spec:
      containers:
        - name: catalog
          image: aot-buildpacks/03-spring-jvm-aot-cache:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 2
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 2
